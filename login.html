<!DOCTYPE html>
<html>
<head>
<title>Student Login</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#111827;
    padding:30px;
    border-radius:15px;
    width:300px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:10px;
    background:#22c55e;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">
    <h2>MCQ Test Login</h2>

    <input id="name" placeholder="Enter Name">
    <input id="phone" placeholder="Enter Phone">

    <button onclick="login()">Start Test</button>
</div>

<script>
function login(){

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;

    fetch("https://script.google.com/macros/s/AKfycbyAzJ_YF80zupIfdOk2rkxbb0oC2S6N2ahY4Gp8EZhAWwhMJnrH7scMAX3LPfM8RnMn/exec", {
        method:"POST",
        body: JSON.stringify({
            name:name,
            phone:phone,
            action:"login"
        })
    })
    .then(res=>res.json())
    .then(data=>{

        if(data.success){
            localStorage.setItem("name",name);
            localStorage.setItem("phone",phone);

            window.location.href="quiz.html";
        }else{
            alert("Access Denied");
        }

    });

}
</script>

</body>
</html>
