<!DOCTYPE html>
<html>
<head>
<title>Login</title>
</head>
<body style="text-align:center; font-family:Arial; background:#111; color:white;">

<h2>Student Login</h2>

<input id="name" placeholder="Enter Name" style="padding:10px;">
<br><br>

<button onclick="start()">Start Test</button>

<script>
function start(){
    let name = document.getElementById("name").value;
    if(name==""){
        alert("Name required");
        return;
    }
    localStorage.setItem("studentName",name);
    window.location.href="quiz.html";
}
</script>

</body>
</html>
