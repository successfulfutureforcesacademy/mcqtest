<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body>

<h2>Student Login</h2>

<input type="text" id="name" placeholder="Name"><br><br>
<input type="text" id="phone" placeholder="Phone"><br><br>

<button onclick="login()">Login</button>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyPpW80XOgbmdtJwYJRJDnKDA82eGUeXmasYTfnuiaAVfjKtmOwQE0k3spikds7I6EB/exec";

function login() {

  var name = document.getElementById("name").value;
  var phone = document.getElementById("phone").value;

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "login",
      name: name,
      phone: phone
    })
  })
  .then(res => res.json())
  .then(data => {

    if (data.success === true) {
      window.location.href = "quiz.html";
    } else {
      alert("Not registered user");
    }

  });

}

</script>

</body>
</html>
