<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body style="margin:0; font-family:Poppins; background:#0b1220; color:white; display:flex; align-items:center; justify-content:center; height:100vh;">

<!-- 🟢 DESIGN SECTION -->
<div style="text-align:center; padding:40px; background:rgba(255,255,255,0.05); border-radius:12px; width:300px;">

  <h2 style="color:#22c55e;">Student Login</h2>

  <input id="name" placeholder="Enter Name"
    style="padding:10px; margin:5px; width:100%;"><br>

  <input id="phone" placeholder="Enter Phone"
    style="padding:10px; margin:5px; width:100%;"><br>

  <button onclick="loginUser()"
    style="padding:10px 20px; background:#22c55e; border:none; color:white; border-radius:6px; width:100%;">
    Login
  </button>

  <p id="msg"></p>

</div>

<!-- 🟡 LOGIC SECTION -->
<script>

/* 🔴 SUPABASE CONFIG (CHANGE ONLY THIS) */
const supabaseUrl = "🔥 PASTE YOUR SUPABASE PROJECT URL HERE 🔥";
const supabaseKey = "🔥 PASTE YOUR SUPABASE ANON KEY HERE 🔥";

const client = supabase.createClient(https://omabmywlqxgelafokdna.supabase.co/, eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tYWJteXdscXhnZWxhZm9rZG5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NjM0MDYsImV4cCI6MjA5NzMzOTQwNn0.9JlCl6F88q5hxQjNde5UtGQnL8-ypACqAxcxgg7f1dg);

async function loginUser(){

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;

  document.getElementById("msg").innerText = "Checking...";

  let { data } = await client
    .from("students")
    .select("*")
    .eq("name", name)
    .eq("phone", phone);

  if(data.length > 0){

    localStorage.setItem("name", name);
    localStorage.setItem("phone", phone);

    window.location.href = "quiz.html";

  } else {
    document.getElementById("msg").innerText = "Not Registered ❌";
  }
}

</script>

</body>
</html>
